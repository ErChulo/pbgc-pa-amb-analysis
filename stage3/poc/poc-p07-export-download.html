<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>P-07 export by download probe (file://)</title></head>
<body><h1>P-07: export by download under file://</h1>
<p>Click each button; confirm the file arrives with the right name and contents. This is the prior generators' proven export path (R5/DEL/436/PF/E.Adm/E.Adj): Blob + URL.createObjectURL + &lt;a download&gt;.</p>
<button id="bJson">Download case-package JSON</button>
<button id="bCsv">Download reconciliation CSV</button>
<pre id="log">ready.</pre>
<script>
"use strict";
var log = document.getElementById("log");
function say(s) { log.textContent += "\n" + s; }
function download(name, text, type) {
  var blob = new Blob([text], { type: type });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  say("download started: " + name + " (" + blob.size + " bytes, " + type + ")");
}
document.getElementById("bJson").onclick = function () {
  download("pa-amb-p07-case.json", JSON.stringify({ formatVersion: "1.0.0", case: "SYNTHETIC-P07", participants: 3 }, null, 2), "application/json");
};
document.getElementById("bCsv").onclick = function () {
  download("pa-amb-p07-reconciliation.csv", "participantKey,paAmbCents,reconCents,deltaCents\nSYN-001,150000,150000,0\nSYN-002,150000,149500,500\n", "text/csv");
};
say("P-07 RESULT: PASS only when the user confirms both files arrive intact (manual step).");
</script></body></html>
