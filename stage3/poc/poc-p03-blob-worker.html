<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>P-03 blob-URL worker probe (file://)</title></head>
<body><h1>P-03: blob-URL Web Worker under file://</h1>
<pre id="log">running…</pre>
<script type="text/plain" id="worker-src">
// Blob-URL worker source (P-03). Runs in a worker created from a blob URL.
// Receives {type:'ping'} -> replies {type:'pong'}.
// Receives {type:'wasm', bytes} -> instantiates embedded bytes, calls add(2,3),
// replies {type:'wasm-result', value}.
self.onmessage = function (e) {
  var d = e.data;
  if (d.type === 'ping') { self.postMessage({ type: 'pong', echo: d.echo }); return; }
  if (d.type === 'wasm') {
    WebAssembly.instantiate(d.bytes, {}).then(function (r) {
      self.postMessage({ type: 'wasm-result', value: r.instance.exports.add(2, 3) });
    }).catch(function (err) {
      self.postMessage({ type: 'wasm-error', error: String(err) });
    });
    return;
  }
  self.postMessage({ type: 'unknown', got: d.type });
};
</script>
<script>
"use strict";
// P-03 probe. Worker source lives in the text/plain block above; a blob URL is
// made from it (no file-path worker, which Chromium blocks from origin "null").
// PASS criterion (Stage 1 §10): worker replies correctly AND instantiates
// WASM bytes posted to it, in Edge under file://, no flags.
var ADD_B64 = "AGFzbQEAAAABBwFgAn9/AX8DAgEABwcBA2FkZAAACgkBBwAgACABags=";
var log = document.getElementById("log");
function say(s) { log.textContent += "\n" + s; }
try {
  var src = document.getElementById("worker-src").textContent;
  var url = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
  say("blob URL created: " + url.slice(0, 40) + "…");
  var w = new Worker(url);
  var gotPong = false;
  w.onmessage = function (e) {
    var d = e.data;
    say("worker replied: " + JSON.stringify(d));
    if (d.type === "pong") { gotPong = true;
      var bin = atob(ADD_B64); var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      w.postMessage({ type: "wasm", bytes: bytes }, [bytes.buffer]);
    }
    if (d.type === "wasm-result") { say(d.value === 5 && gotPong ? "P-03 RESULT: PASS" : "P-03 RESULT: FAIL"); }
    if (d.type === "wasm-error") { say("P-03 RESULT: FAIL (worker wasm error)"); }
  };
  w.onerror = function (e) { say("worker ERROR: " + e.message); say("P-03 RESULT: FAIL"); };
  w.postMessage({ type: "ping", echo: "hello" });
} catch (e) { say("ERROR: " + e); say("P-03 RESULT: FAIL"); }
</script></body></html>
